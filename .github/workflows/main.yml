name: MTC PIS & OBU Health Check

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Gives you a manual 'Run Workflow' button

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (For OpenCV/ddddocr)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Packages
        run: |
          pip install pandas numpy opencv-python ddddocr playwright openpyxl
          playwright install chromium

      - name: Run Health Check Script
        env:
          MTC_USERNAME: ${{ secrets.MTC_USERNAME }}
          MTC_PASSWORD: ${{ secrets.MTC_PASSWORD }}
        run: python main.py

      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: Health_Check_Reports
          path: output/*.xlsx
          retention-days: 7
